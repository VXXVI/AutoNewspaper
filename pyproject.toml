[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper-auto"
description = "可扩展的数字报关键词每日监测（内置六家官网，零第三方运行时依赖）"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "7Quark" }]
keywords = ["newspaper", "epaper", "scraper", "monitoring", "china"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Indexing",
]
# 刻意保持为零：运行时只用标准库 + 系统 curl
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# 仅构建 Windows 单文件 exe 时需要；运行时不引入任何依赖。
packaging = ["pyinstaller>=6.0"]

[project.scripts]
newspaper-scan = "newspaper_auto.cli:main"
newspaper-dashboard = "newspaper_auto.web:main"
newspaper-auto = "newspaper_auto.exe:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newspaper_auto = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.dynamic]
version = { attr = "newspaper_auto.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]
exclude = ["legacy", "hits", "state", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP", "RUF"]
# 中文正文里的全角标点会被 RUF001/2/3 误判为「易混淆字符」，此处关闭
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试里长字符串与 fixture 断言较多，放宽行长与布尔比较
"tests/*" = ["E501"]
