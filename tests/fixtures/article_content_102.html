<h1>示例大学与湛江市人民政府签署战略合作协议</h1>
<div class="byline">来源：湛江日报　2026-09-22 09:00</div>
<founder-content>
<p>本报讯　近日，双方在市区举行签约仪式，围绕人才培养、科技攻关、成果转化等领域深化合作。</p>
<p>根据协议，双方将共建创新平台，推动更多科研成果在本地转化落地，助力地方产业转型升级。</p>
<p>签约仪式上，双方代表还就下一步重点工作进行了交流，并表示将建立常态化沟通机制。</p>
</founder-content>
