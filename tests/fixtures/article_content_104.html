<div class="paper-head">湛江日报 2026年09月22日 星期二 第03版：教育</div>
<h1>高校服务地方经济社会发展座谈会召开</h1>
<founder-content>
<p>本报讯　近日，高校服务地方经济社会发展座谈会在市区举行。</p>
<p>来自<em>示例</em>大<strong>学</strong>等院校的代表围绕人才培养、科技成果转化等主题作了交流发言。</p>
<p>与会代表一致认为，要深化校地合作，推动更多科研成果在本地转化落地。</p>
</founder-content>
