# 临时实验：只回答一个问题——
# 「私有仓库 + 免费账号下，schedule 到底触发不触发？」
#
# 只打印触发方式与时间，不做任何其他事情，也不写仓库。
# 测出结论后即可删除。
name: schedule-probe

on:
  workflow_dispatch:
  schedule:
    # 每 5 分钟一次，仅用于本次实验；生产不会用这么密的频率
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 记录触发方式与时间
        run: |
          echo "event    = $GITHUB_EVENT_NAME"
          echo "UTC      = $(date -u '+%F %T')"
          echo "北京时间 = $(TZ=Asia/Shanghai date '+%F %T %Z')"
          echo "sha      = $GITHUB_SHA"
