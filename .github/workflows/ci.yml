name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（含开发依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 代码检查（ruff）
        run: ruff check .

      - name: 格式检查（ruff format）
        run: ruff format --check .

      - name: 单元测试
        run: pytest -q

      - name: Shell 脚本语法检查
        run: bash -n scripts/run_scan.sh scripts/install_launchd.sh
