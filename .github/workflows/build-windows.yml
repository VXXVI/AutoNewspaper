name: build-windows

# 可复用 + 可手动触发：在 windows-latest 上构建单文件 exe 并产出可分发的 zip。
#
# - workflow_dispatch：在 Actions 页手动构建并下载 artifact（无需打 tag）；
# - workflow_call：由 release.yml 在打 v* tag 时复用，产物随 Release 一起发布。
#
# 构建 / 冒烟 / 打包逻辑均在 scripts/build_windows.ps1，两个入口共用同一份实现。
#
# 输入：
#   version         版本标签（留空则用源码里的 __version__）
#   python-version  构建用 Python。**Windows 7 必须填 3.8.10** —— Python 官方从 3.9
#                   起不再支持 Win7，3.9+ 打出来的 exe 在 Win7 上会直接报
#                   「不是有效的 Win32 程序」。默认 3.12 服务主线。
#   target          产物平台标签，决定 zip 名 NewspaperAuto-<版本>-<target>-x64.zip，
#                   并连带决定 artifact 名。近来的产物只有便携 zip（自 v1.0.4.1 起
#                   不再构建 setup 安装包，因此也不需要 Inno Setup）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本标签（留空则使用源码中的版本号）"
        required: false
        default: ""
      python-version:
        description: "构建用 Python 版本（Windows 7 请填 3.8.10）"
        required: false
        default: "3.12"
      target:
        description: "产物平台标签（windows / win7），决定 zip 名"
        required: false
        default: "windows"
  workflow_call:
    inputs:
      version:
        description: "版本标签（留空则使用源码中的版本号）"
        required: false
        type: string
        default: ""
      python-version:
        description: "构建用 Python 版本（Windows 7 请填 3.8.10）"
        required: false
        type: string
        default: "3.12"
      target:
        description: "产物平台标签（windows / win7），决定 zip 名"
        required: false
        type: string
        default: "windows"

permissions:
  contents: read

jobs:
  windows-exe:
    name: 构建 Windows 单文件 exe（${{ inputs.target }}）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ inputs.python-version }}"

      - name: 源码冒烟（非主线 Python 时运行：把无窗口 exe 吞掉的 traceback 逼出来）
        if: inputs.python-version != '3.12'
        shell: pwsh
        run: |
          # 无窗口 exe 下 stdout/stderr 是 None，启动失败只会弹一个（在 CI 里没人点的）
          # MessageBox，真正的原因看不到。所以先在**源码**上把同一套启动流程跑一遍。
          $env:PYTHONPATH = Join-Path $PWD 'src'
          $dataDir = Join-Path $PWD 'build\smoke-src'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $outFile = Join-Path $PWD 'build\smoke-src.out'
          $errFile = Join-Path $PWD 'build\smoke-src.err'

          Write-Host '1) 导入检查'
          python -c "import newspaper_auto.web, newspaper_auto.cli, newspaper_auto.exe, newspaper_auto.scanner, newspaper_auto.report, newspaper_auto.state, newspaper_auto.http, newspaper_auto.web_server; print('imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host '2) 源码起看板（前台，输出重定向到文件）'
          $proc = Start-Process -FilePath 'python' `
            -ArgumentList @('-m', 'newspaper_auto.web', '--port', '8798', '--data-dir', $dataDir) `
            -PassThru -NoNewWindow -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            if ($proc.HasExited) { break }
            try {
              if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8798/api/health' -TimeoutSec 2).StatusCode -eq 200) { $ready = $true; break }
            } catch { }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Write-Host '---- source stdout ----'
          Get-Content -LiteralPath $outFile -ErrorAction SilentlyContinue
          Write-Host '---- source stderr ----'
          Get-Content -LiteralPath $errFile -ErrorAction SilentlyContinue
          if (-not $ready) { Write-Host '::error::源码在目标 Python 下也起不来（见上面 stderr）'; exit 1 }
          Write-Host '源码冒烟通过。'

      - name: 构建 exe（含冒烟测试与 zip 组装）
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $t = "${{ inputs.target }}"
          # 注意：数组 splat（@array）是「位置参数」，不会把 '-Target' 当参数名；
          # 具名参数必须用哈希表 splat，否则 '-Target' 会被当成 $Version 的值。
          $buildArgs = @{}
          if ($t) { $buildArgs['Target'] = $t }
          if ($v) { $buildArgs['Version'] = $v }
          ./scripts/build_windows.ps1 @buildArgs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NewspaperAuto-${{ inputs.target }}-x64
          path: dist/NewspaperAuto-*-${{ inputs.target }}-x64.zip
          if-no-files-found: error
