name: build-windows

# 手动触发：在 windows-latest 上构建单文件 exe 并产出可分发的 zip（作为 artifact 下载），
# 不需要打 tag。打 v* tag 时的正式发布由 release.yml 负责。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本标签（留空则使用源码中的版本号）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows-exe:
    name: 构建 Windows 单文件 exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 构建 exe（含冒烟测试与 zip 组装）
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ($v) { ./scripts/build_windows.ps1 -Version $v } else { ./scripts/build_windows.ps1 }

      - uses: actions/upload-artifact@v4
        with:
          name: NewspaperAuto-windows-x64
          path: dist/NewspaperAuto-*-windows-x64.zip
          if-no-files-found: error
