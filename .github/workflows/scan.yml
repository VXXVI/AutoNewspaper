# 每日自动扫描：GitHub Actions 版（生产形态）
#
# 与本地 launchd 版本等价，但跑在 GitHub 托管 runner 上：
#   - 结果（hits/ 与 state/seen.json）提交回仓库，这样增量语义得以保留，
#     同时白送一份完整的审计历史；
#   - TZ 必须是 Asia/Shanghai：本项目用 datetime.now() 判断「今天」，
#     而 runner 默认 UTC。07:00(北京) 时 UTC 还是前一天 23:00，
#     不设置就会去扫「昨天的报纸」，静默漏掉当天内容。
#
# 注意：本地 launchd 与本 workflow 会写同一个 state/seen.json，
# 两者同时启用会互相覆盖增量状态——请二选一。
name: daily-scan

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 次日 07:00 北京时间（配合下方 TZ）
    - cron: "0 23 * * *"

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 确认运行时间与时区
        run: |
          echo "触发方式: $GITHUB_EVENT_NAME"
          echo "北京时间: $(date '+%F %T %Z')"
          echo "UTC 时间: $(date -u '+%F %T')"

      - name: 执行扫描（增量，--days 1）
        run: python3 daily_scan.py --days 1

      - name: 把结果提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state hits
          if git diff --cached --quiet; then
            echo "本次无新增，无需提交"
            exit 0
          fi
          git commit -m "chore(scan): $(date '+%F') 自动扫描结果"
          git pull --rebase --autostash origin main
          git push
