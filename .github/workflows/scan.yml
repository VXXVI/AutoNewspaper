# 每日自动扫描：GitHub Actions 版（生产形态）
#
# 与本地 launchd 版本等价，但跑在 GitHub 托管 runner 上：
#   - 结果（hits/ 与 state/seen.json）提交回仓库，这样增量语义得以保留，
#     同时白送一份完整的审计历史；
#   - TZ 必须是 Asia/Shanghai：本项目用 datetime.now() 判断「今天」，
#     而 runner 默认 UTC。07:00(北京) 时 UTC 还是前一天 23:00，
#     不设置就会去扫「昨天的报纸」，静默漏掉当天内容。
#
# 注意：本地 launchd 与本 workflow 会写同一个 state/seen.json，
# 两者同时启用会互相覆盖增量状态——请二选一。
name: daily-scan

on:
  workflow_dispatch:
  # 供外部定时服务调用（实测：私有仓库下 schedule 不生效，靠这个兜底）：
  #   gh api repos/<owner>/<repo>/dispatches -f event_type=scan
  #   或任意 HTTP POST /repos/<owner>/<repo>/dispatches  {"event_type":"scan"}
  repository_dispatch:
    types: [scan]
  schedule:
    # 23:00 UTC = 次日 07:00 北京时间（配合下方 TZ）
    # 注意：实测「私有仓库 + 免费个人账号」下该触发器一次都不会触发，仅公开仓库可靠
    - cron: "0 23 * * *"

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 确认运行时间与时区
        run: |
          echo "触发方式: $GITHUB_EVENT_NAME"
          echo "北京时间: $(date '+%F %T %Z')"
          echo "UTC 时间: $(date -u '+%F %T')"

      - name: 执行扫描（增量，--days 1）
        id: scan
        run: python3 daily_scan.py --days 1
        # 入口失败时以非零退出（让步骤变红、工作流最终判 failure），
        # 但不用 continue-on-error——而是在提交步骤用 if: always() 确保
        # 已落盘的增量结果（hits/ state/）仍能被提交回仓库。

      - name: 把结果提交回仓库
        if: always()   # 扫描步骤失败（入口失败）时也要执行，以免丢失已写入的部分结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state hits
          if git diff --cached --quiet; then
            echo "本次无变化，无需提交"
            exit 0
          fi
          SCAN_STATUS="${{ steps.scan.outcome }}"
          SUFFIX=""
          if [ "$SCAN_STATUS" != "success" ]; then SUFFIX=" [含失败]"; fi
          git commit -m "chore(scan): $(date '+%F') 自动扫描结果${SUFFIX}"
          git pull --rebase --autostash origin main
          git push
