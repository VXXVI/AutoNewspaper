# 每日自动扫描：GitHub Actions 版（生产形态）
#
# 与本地 launchd 版本等价，但跑在 GitHub 托管 runner 上：
#   - 结果（hits/ 与 state/seen.json）提交回仓库，这样增量语义得以保留，
#     同时白送一份完整的审计历史；
#   - TZ 必须是 Asia/Shanghai：本项目用 datetime.now() 判断「今天」，
#     而 runner 默认 UTC。10:00(北京) 时 UTC 是当日 02:00（同日，无跨日错位风险），
#     不设置就会按 UTC 去扫「昨天的报纸」，静默漏掉当天内容。
#
# 注意：本地 launchd / Windows 任务计划程序均以 run_scan 脚本带 --no-state 运行，
# 不读写 state/seen.json、不产 hits/，因此可与本 workflow 并存，不会互相覆盖。
name: daily-scan

on:
  workflow_dispatch:
  # 供外部定时服务调用（当前生产路径，也可作 schedule 的准点兜底）：
  #   gh api repos/<owner>/<repo>/dispatches -f event_type=scan
  #   或任意 HTTP POST /repos/<owner>/<repo>/dispatches  {"event_type":"scan"}
  repository_dispatch:
    types: [scan]
  schedule:
    # GitHub 官方支持私有仓库的 schedule，但不保证精确准点；
    # 避开整点高峰，02:07 UTC = 当日 10:07 北京时间（配合下方 TZ）。
    - cron: "7 2 * * *"

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 确认运行时间与时区
        run: |
          echo "触发方式: $GITHUB_EVENT_NAME"
          echo "北京时间: $(date '+%F %T %Z')"
          echo "UTC 时间: $(date -u '+%F %T')"

      - name: 执行扫描（增量，--days 2）
        id: scan
        run: python3 daily_scan.py --days 2
        # 回溯 2 天（今天 + 昨天）：README 承诺「漏掉一天第二天会自动补回来」，
        # 只扫 1 天时若某报入口当天失败或报纸当天未上线，该日文章不会被后续运行覆盖，
        # 且 seen.json 也不会记录 → 永久漏报。已在 v0.3.1 与 run_scan.sh / README 对齐。
        # 入口失败时以非零退出（让步骤变红、工作流最终判 failure），
        # 但不用 continue-on-error——而是在提交步骤用 if: always() 确保
        # 已落盘的增量结果（hits/ state/）仍能被提交回仓库。

      - name: 把结果提交回仓库
        if: always()   # 扫描步骤失败（入口失败）时也要执行，以免丢失已写入的部分结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state hits
          if git diff --cached --quiet; then
            echo "本次无变化，无需提交"
            exit 0
          fi
          SCAN_STATUS="${{ steps.scan.outcome }}"
          SUFFIX=""
          if [ "$SCAN_STATUS" != "success" ]; then SUFFIX=" [含失败]"; fi
          git commit -m "chore(scan): $(date '+%F') 自动扫描结果${SUFFIX}"
          git pull --rebase --autostash origin main
          git push
