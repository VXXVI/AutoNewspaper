name: Release

# 打 v* tag 时构建 Python 分发包（sdist/wheel/便携源码 zip）与 Windows 单文件 exe，
# 一并挂到 GitHub Release。
#
# 用户侧分发：
#   - Python 用户：pip install <release 里的 .whl> 或 uv tool install <whl/git>；
#   - Windows 用户：下载 NewspaperAuto-<tag>-windows-x64.zip，解压双击即用（内含 exe）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: 构建 Python 分发包 (sdist + wheel + portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: python -m pip install --upgrade build

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 冒烟验证 wheel（全新安装 + 版本 + 前端资源随包）
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/newspaper-scan" --version
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib
          import newspaper_auto

          static = pathlib.Path(newspaper_auto.__file__).parent / "static" / "app.js"
          assert static.is_file(), "static/ 资源未随 wheel 安装"
          print("static OK:", static)
          PY

      - name: 打包便携源码 zip（去掉 CI/测试/历史方案与本机运行数据，解压即用）
        run: |
          git archive --format=zip --prefix="NewspaperAuto-${GITHUB_REF_NAME}/" \
            -o "NewspaperAuto-${GITHUB_REF_NAME}-portable.zip" HEAD \
            ':(exclude)tests' ':(exclude)legacy' ':(exclude)docs' ':(exclude).github' \
            ':(exclude)state' ':(exclude)hits'
        # state/（seen.json 增量状态）与 hits/（历史命中归档）是维护者的本机运行数据，
        # 打进便携包会让接收方首次扫描显示「0 新增」。程序会在需要时自行创建这两个目录。

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            NewspaperAuto-*-portable.zip
          if-no-files-found: error

  windows-exe:
    name: 构建 Windows 单文件 exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 构建 exe（含冒烟测试与 zip 组装）
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version "${env:GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/NewspaperAuto-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: [build, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 并上传全部产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release-assets
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --generate-notes -R "${{ github.repository }}"
