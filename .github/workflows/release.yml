name: Release

# 打 v* tag 时构建 Python 分发包（sdist/wheel/便携源码 zip）与 Windows 单文件 exe，
# 一并挂到 GitHub Release。
#
# 用户侧分发：
#   - Python 用户：pip install <release 里的 .whl> 或 uv tool install <whl/git>；
#   - Windows 用户：下载 NewspaperAuto-<tag>-windows-x64.zip，解压双击即用（内含 exe）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: 构建 Python 分发包 (sdist + wheel + portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: python -m pip install --upgrade build
        # 注：build 及其传递依赖（setuptools / wheel / pyproject-hooks）未固定版本，
        # 供应链风险高于已 SHA 固定的 actions；如需可复现构建，应在这里固定到具体版本。

      - name: 构建 sdist 与 wheel
        run: python -m build
        # 同上：`python -m build` 本身也不锁版本，仅由上面 pip 安装时的最新版决定。

      - name: 冒烟验证 wheel（全新安装 + 版本 + 前端资源随包 + 随包根证书随包）
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/newspaper-scan" --version
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib
          import newspaper_auto

          home = pathlib.Path(newspaper_auto.__file__).parent
          assert (home / "static" / "app.js").is_file(), "static/ 资源未随 wheel 安装"

          # 随包根证书：漏了就只剩系统根库，Win7 一类缺锚点的机器会整家抓不到中国教育报。
          bundle = home / "cacert.pem"
          assert bundle.is_file(), "cacert.pem 未随 wheel 安装"
          text = bundle.read_text(encoding="utf-8")
          assert "BEGIN CERTIFICATE" in text, "cacert.pem 内容不像 PEM 证书包"
          print("static OK:", home / "static" / "app.js")
          print("cacert OK:", bundle)
          PY

      - name: 打包便携源码 zip（去掉 CI/历史方案与本机运行数据，解压即用）
        run: |
          # docs/ 现在随源码包一起发布（README 会链接到 docs/ 下的说明），
          # 因此这里不再排除 docs/，与 .gitattributes、MANIFEST.in 保持一致。
          git archive --format=zip --prefix="NewspaperAuto-${GITHUB_REF_NAME}/" \
            -o "NewspaperAuto-${GITHUB_REF_NAME}-portable.zip" HEAD \
            ':(exclude)tests' ':(exclude)legacy' ':(exclude).github' \
            ':(exclude)state' ':(exclude)hits'
        # state/（seen.json 增量状态）与 hits/（历史命中归档）是维护者的运行数据，
        # 打进便携包会让接收方首次扫描显示「0 新增」。程序会在需要时自行创建这两个目录。

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            NewspaperAuto-*-portable.zip
          if-no-files-found: error

  windows-exe:
    name: 构建 Windows 单文件 exe
    # 复用 build-windows.yml（同一个可复用工作流也可在 Actions 页手动触发），
    # 避免两处维护近乎逐行相同的构建步骤。
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ github.ref_name }}

  windows-exe-win7:
    name: 构建 Windows 7 单文件 exe
    # Windows 7 必须用 Python 3.8 构建（3.9+ 的运行时在 Win7 上跑不起来），
    # 其余流程与主线完全一致 —— 同一个可复用工作流，只是换了 python-version / target。
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ github.ref_name }}
      python-version: "3.8.10"
      target: "win7"

  release:
    name: 发布到 GitHub Release
    needs: [build, windows-exe, windows-exe-win7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建/更新 Release 并上传全部产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release-assets
          # download-artifact 会保留部分目录层级（如 dist/），必须只挑文件，
          # 否则 gh 会把目录当资产上传并报 "read ...: is a directory"。
          mapfile -t assets < <(find release-assets -type f -print | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "没有可发布的产物" >&2
            exit 1
          fi
          printf '待发布：%s\n' "${assets[@]}"
          if gh release view "${GITHUB_REF_NAME}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
              --clobber -R "${{ github.repository }}"
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --generate-notes -R "${{ github.repository }}"
          fi
