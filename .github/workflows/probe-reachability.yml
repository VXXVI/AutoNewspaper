# 临时用：验证 GitHub 托管的 runner 能否稳定访问五家报社数字报。
#
# 这是「能不能把本项目搬到 GitHub Actions 上跑」的前置实测：
#   - 全程 --no-state / --dry，只读，不写任何文件，不改动仓库；
#   - 只做探测，不提交结果；
#   - 实测完即可删除（或作为后续定时任务的雏形）。
#
# 关键点：显式设 TZ=Asia/Shanghai。本项目用 datetime.now() 决定「今天是哪一天」，
# 而 GitHub runner 默认是 UTC —— 不设置的话 07:00(北京) 会去扫「UTC 的前一天」，
# 拿不到当天报纸。这一条在真正部署时必须保留。
name: probe-reachability

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 运行环境与出口位置
        run: |
          echo "--- 运行环境 ---"
          echo "Python : $(python3 -V 2>&1)"
          echo "curl   : $(curl --version | head -1)"
          echo "TZ     : $TZ"
          echo "本地时间: $(date '+%F %T %Z')"
          echo "UTC时间 : $(date -u '+%F %T')"
          echo
          echo "--- 出口 IP（判断 runner 落在哪个区域）---"
          curl -s --max-time 20 https://ipinfo.io/json || echo "（ipinfo 不可达）"
          echo

      - name: 原始 curl 可达性与延迟（逐家，不走解析层）
        continue-on-error: true
        run: |
          UA=$(python3 -c 'import sys; sys.path.insert(0,"src"); from newspaper_auto import config; print(config.UA)')
          python3 - <<'PY' > /tmp/urls.txt
          import sys
          from datetime import datetime
          sys.path.insert(0, "src")
          from newspaper_auto import config, parse
          today = datetime.now()
          for p in config.PAPERS:
              print(p["name"], p["tpl"].format(a=parse.date_path(today, p["style"])))
          PY
          echo "--- 逐家入口探测（HTTP1.1，30s 超时）---"
          while read -r name url; do
            read -r code total size <<<"$(curl -sL --http1.1 -o /dev/null \
              -w '%{http_code} %{time_total} %{size_download}' \
              -m 30 -A "$UA" "$url")"
            printf '%-6s HTTP %-4s %7ss %9sB  %s\n' "$name" "$code" "$total" "$size" "$url"
          done < /tmp/urls.txt

      - name: 入口探测（--dry，走真实代码路径）
        continue-on-error: true
        run: python3 daily_scan.py --days 1 --dry

      - name: 全量扫描（--no-state --json，不写入任何文件）
        id: scan
        continue-on-error: true
        run: |
          start=$(date +%s)
          python3 daily_scan.py --days 1 --no-state --json > /tmp/hits.json 2> /tmp/scan.log
          rc=$?
          end=$(date +%s)
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          echo "wall=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "--- 扫描日志 ---"
          cat /tmp/scan.log
          echo
          echo "--- 命中 JSON（$(wc -c < /tmp/hits.json) 字节）---"
          cat /tmp/hits.json

      - name: 汇总
        if: always()
        run: |
          {
            echo ""
            echo "### 全量扫描（真实抓取，--no-state）"
            echo ""
            echo "- 退出码：\`${{ steps.scan.outputs.exit }}\`"
            echo "- 墙钟耗时：**${{ steps.scan.outputs.wall }} 秒**"
            echo ""
            echo '```'
            cat /tmp/scan.log 2>/dev/null || echo "(无日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
